name: Generate tilestion release

on:
  workflow_dispatch:

jobs:
  generate-tilestion-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout list from dev
        uses: actions/checkout@v6

      - name: Install Nix
        uses: NixOS/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Build tilestion export
        shell: bash
        run: nix build .#tilestion-export

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # use version specified in file as tag
          TAG=$(cat ./result | jq -r .version)

          # ./result is a symlink into the nix store; dereference it into a
          # properly named file so the release asset gets a sensible name.
          mkdir -p dist
          cp -L ./result dist/telemetry.json

          gh release create "$TAG" \
            --target "${GITHUB_SHA}" \
            --title "GCS export version $TAG" \
            --generate-notes \
            dist/telemetry.json
